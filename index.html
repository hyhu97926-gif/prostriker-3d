<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Pro Striker 3D</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#0b1a12;--fg:#f2f7f3;--ac:#2ee06f;--pn:rgba(8,20,14,.9);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Segoe UI,Arial,sans-serif;overflow:hidden}
#c{position:fixed;inset:0}
#hud{display:none;position:fixed;inset:0;pointer-events:none}
#sb{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:var(--pn);padding:6px 22px;border-radius:10px;font-size:22px;font-weight:700;display:flex;gap:14px;align-items:center}
#clk{color:var(--ac);font-size:18px}
#msg{position:absolute;top:36%;width:100%;text-align:center;font-size:44px;font-weight:900;text-shadow:0 4px 18px #000}
#cb{position:absolute;bottom:18px;left:50%;width:220px;height:10px;margin-left:-110px;background:#0008;border-radius:6px;overflow:hidden}
#chg{height:100%;width:0;background:var(--ac)}
#tip{position:absolute;bottom:34px;width:100%;text-align:center;font-size:12px;opacity:.7}
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0009}
.box{background:var(--pn);padding:26px 32px;border-radius:16px;width:min(460px,90vw);text-align:center}
h1{margin:0 0 4px;letter-spacing:2px}h1 span{color:var(--ac)}
.row{display:flex;gap:12px;margin:12px 0}label{flex:1;font-size:12px;text-align:left}
select{width:100%;padding:8px;margin-top:4px;background:#13281d;color:var(--fg);border:1px solid #2a4a38;border-radius:8px}
button{width:100%;padding:13px;font-size:18px;font-weight:800;background:var(--ac);color:#04140a;border:0;border-radius:10px;cursor:pointer}
.soon{font-size:12px;opacity:.55;margin:12px 0}.help{font-size:12px;opacity:.8;line-height:1.6;margin:0}
#menu{background:linear-gradient(120deg,#000d,#0a3a22cc,#000d);overflow:auto}.box{width:min(780px,94vw);animation:pop .5s}@keyframes pop{from{opacity:0;transform:translateY(24px)}}h1{font-size:34px;font-style:italic}
.ov{display:none;position:fixed;inset:0;align-items:center;justify-content:center;background:#000b;z-index:10}#set{z-index:20}
button.alt{background:#1d3b2b;color:var(--fg);margin-top:8px;font-size:14px;padding:10px}
.tl{flex:1;max-height:210px;overflow-y:auto;text-align:left}.tc{display:flex;gap:6px;align-items:center;padding:5px 8px;margin:2px 0;border-radius:8px;background:#13281d;cursor:pointer;font-size:13px}.tc.on{outline:2px solid var(--ac);background:#1d4630}.tc em{margin-left:auto;color:var(--ac);font-style:normal;font-weight:700}.sw{width:16px;height:16px;border-radius:4px;border:3px solid}
#sq{display:flex;gap:14px;font-size:12px;opacity:.85;text-align:left;margin:8px 0}#sq div{flex:1}
.kb{display:flex;justify-content:space-between;align-items:center;margin:4px 0;font-size:14px}.kb button{width:140px;padding:6px;font-size:13px}
#mini{position:absolute;left:14px;bottom:14px;border:2px solid #fff6;border-radius:6px}#who{position:absolute;bottom:46px;width:100%;text-align:center;font-weight:700;text-shadow:0 2px 6px #000}
#sb2{position:absolute;bottom:32px;left:50%;width:220px;height:6px;margin-left:-110px;background:#0008;border-radius:4px;overflow:hidden}#stm{height:100%;background:#4cc9f0}#tip{bottom:2px}#swt{position:absolute;top:64px;width:100%;text-align:center;font-size:22px;font-weight:800;color:#ffe14d;text-shadow:0 2px 8px #000;opacity:0;transition:opacity .4s}#gkb{display:none;position:absolute;right:14px;bottom:14px;width:auto;padding:10px 14px;font-size:14px;pointer-events:auto}
#intro{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:#0d0d0d;transition:opacity .5s}
#intro .ib{display:flex;flex-direction:column;align-items:center;gap:18px;animation:iseq 4.4s ease both}
#intro span{font-size:15px;letter-spacing:7px;color:#9a9a9a}#intro img{width:min(480px,70vw)}
@keyframes iseq{0%{opacity:0}22%{opacity:1}74%{opacity:1}100%{opacity:0}}
table.stt{width:100%;font-size:12px;border-collapse:collapse;margin:8px 0}.stt th,.stt td{padding:2px 5px;text-align:right}.stt th:first-child,.stt td:first-child{text-align:left}.stt th{color:var(--ac)}#pause .box{max-height:92vh;overflow:auto}
.lb{width:min(300px,60vw);height:3px;background:#333;border-radius:2px;overflow:hidden}.lb i{display:block;height:100%;width:0;background:#2ee06f;animation:lbar 4.2s linear forwards}@keyframes lbar{to{width:100%}}
#err{display:none;position:fixed;left:10px;right:10px;bottom:10px;z-index:200;background:#7a1020;color:#fff;padding:10px 14px;border-radius:8px;font-size:13px}
</style></head><body>

function renderTeams(){[['lh','th'],['la','ta']].forEach(([el,sel])=>{const s=$(sel),box=$(el);box.innerHTML='';TEAMS.forEach((t,i)=>{const d=document.createElement('div');d.className='tc'+(+s.value===i?' on':'');d.innerHTML='<i class="sw" style="background:#'+t.c.toString(16).padStart(6,'0')+';border-color:#'+t.c2.toString(16).padStart(6,'0')+'"></i><img src="'+flag(t)+'" width="24" height="16"><img src="'+crest(t)+'" width="16" height="17">  '+t.n+'<em>'+t.r+(t.o?'*':'')+'</em>';d.onclick=()=>{s.value=i;renderTeams()};box.appendChild(d)})});
 $('sq').innerHTML=[TEAMS[+$('th').value],TEAMS[+$('ta').value]].map(t=>'<div><b>'+t.n+'</b><br>'+t.p.map(s=>s.split(':')[0]).join(' · ')+(t.b?'<br><i>Bench:</i> '+t.b.split(',').map(s=>s.split(':')[0]).join(' · '):'')+'</div>').join('')+'<div style="opacity:.6">* real names = unofficial placeholder data, ratings approximate. Edit TEAMS in the code.</div>'}
function togglePause(){S.pause^=1;if(S.pause)document.exitPointerLock();else lock();$('sbb').textContent='SUBSTITUTE CONTROLLED PLAYER ('+S.sb[0]+' left)';$('pt').textContent='PAUSED';$('rs').textContent='RESUME';$('pause').style.display=S.pause?'flex':'none';if(S.pause){const p=S.poss,t=p[0]+p[1];$('pst').innerHTML='<p style="font-size:22px">'+TEAMS[S.tm[0]].a+' '+S.score[0]+' - '+S.score[1]+' '+TEAMS[S.tm[1]].a+'</p><p class="help">Shots '+S.st[0].sh+' - '+S.st[1].sh+'<br>Passes '+S.st[0].ps+' - '+S.st[1].ps+'<br>Possession '+Math.round(p[0]/t*100)+'% - '+Math.round(p[1]/t*100)+'%</p>'+statsTable()}}
function who(){const c=S.ctrl;if(c!==S.lastC){S.lastC=c;if(c&&S.state==='play')toast('▶ #'+c.num+' '+c.nm+' · '+c.role)}if(S.swT&&performance.now()>S.swT){S.swT=0;$('swt').style.opacity=0}$('gkb').textContent=S.gkc?'PLAYING AS KEEPER (G: back)':'CONTROL KEEPER (G)';$('who').textContent=c?'#'+c.num+'  '+c.nm+' · '+c.role+'  |  '+attrs(c)+'  |  G'+c.gl+' Sh'+(c.sh||0):'';$('stm').style.width=S.stam*100+'%'}
function mini(){const c=$('mini').getContext('2d'),w=180,h=118,X=x=>w/2+x/L*(w/2-4),Z=z=>h/2+z/W*(h/2-4);c.clearRect(0,0,w,h);c.fillStyle='#1d6b2c';c.fillRect(0,0,w,h);c.strokeStyle='#fff8';c.lineWidth=1;c.strokeRect(4,4,w-8,h-8);c.beginPath();c.moveTo(w/2,4);c.lineTo(w/2,h-4);c.stroke();
 players.forEach(p=>{c.fillStyle='#'+S.kit[p.team].toString(16).padStart(6,'0');c.beginPath();c.arc(X(p.x),Z(p.z),p===S.ctrl?5.5:3.5,0,7);c.fill();c.lineWidth=p===S.ctrl?2.5:1.5;c.strokeStyle=p.team?'#000':'#fff';c.stroke()});c.fillStyle='#fff';c.beginPath();c.arc(X(B.x),Z(B.z),2.5,0,7);c.fill()}
$('st').onclick=$('pc').onclick=()=>{$('set').style.display='flex'};$('sx').onclick=()=>{$('set').style.display='none'};$('rs').onclick=togglePause;$('kr').onclick=()=>{Object.assign(KB,DK);try{localStorage.removeItem('kb2')}catch(e){}renderKB()};
$('qt').onclick=()=>{togglePause();document.exitPointerLock();S.state='menu';$('menu').style.display='flex';$('hud').style.display='none';$('mt').textContent='Quick Match'};
function applyTime(){const n=+$('tm').value;S.night=n;scene.background.set(n?0x101a3a:0xcfe4f7);scene.fog.color.copy(scene.background);SKY.material.map=SKT[n];SKY.material.needsUpdate=true;hemi.intensity=n?.14:.8;sun.intensity=n?.1:.9;sun.color.set(n?0x8fa8ff:0xfff4e0);FILL.intensity=n?.06:.25;renderer.toneMappingExposure=n?1.05:1.15;(window.FL||[]).forEach(l=>l.intensity=n?1.3:0)}
function lock(){try{renderer.domElement.requestPointerLock()}catch(e){}}
const lk=()=>document.pointerLockElement===renderer.domElement;
document.addEventListener('pointerlockchange',()=>{if(!lk()&&!S.pause&&(S.state==='play'||S.state==='set'||S.state==='kick'||S.state==='goal'))togglePause()});
addEventListener('mousemove',e=>{if(lk()){}});
addEventListener('mousedown',e=>{if(!lk())return;if(e.button===0)S.m0=1;if(e.button===2)PQ.pass=1});
addEventListener('mouseup',e=>{if(e.button===0)S.m0=0});
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('wheel',e=>{S.cd=Math.max(5,Math.min(16,(S.cd||9)+Math.sign(e.deltaY)))});
$('c').addEventListener('click',()=>{if(S.state==='play'&&!S.pause&&!lk())lock()});
$('so').onclick=startSO;$('sbb').onclick=()=>{subP();$('sbb').textContent='SUBSTITUTE CONTROLLED PLAYER ('+S.sb[0]+' left)'};$('gkb').onclick=()=>{S.gkc^=1;S.lock=.8};$('go').onclick=startMatch;$('q').onchange=applyQ;init();loop();applyTime();$('mlogo').src=document.querySelector('#intro img').src;$('tm').onchange=applyTime;
</script></body></html>
