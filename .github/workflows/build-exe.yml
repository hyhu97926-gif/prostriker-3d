name: Build Windows EXE
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download three.js
        run: Invoke-WebRequest https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js -OutFile three.min.js
      - run: npm install
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ProStriker3D-exe
          path: dist/ProStriker3D.exe
